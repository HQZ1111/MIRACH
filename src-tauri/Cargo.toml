[package]
name = "mirach"
version = "0.1.5"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "mirach_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[target.'cfg(windows)'.dependencies]
# 关掉 Win11 给窗口自带的 ~8px 系统圆角（透明窗口 + 内容 40px 圆角时才不会露出 8px 线框）
windows = { version = "0.61", features = [
    "Win32_Graphics_Dwm",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
] }
# WebView2 权限钩子（麦克风）：wry 只自动放行剪贴板，getUserMedia 会被默认拒绝
# （实测 NotAllowedError: Permission denied by system）。版本与 tauri/wry 锁定的 0.38.2 一致。
webview2-com = "0.38"

[dependencies]
tauri = { version = "2", features = ["unstable"] }
tauri-plugin-opener = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-deep-link = "2"
# 单实例：第二次启动只聚焦已有窗口（官方桌面壳同款语义）
tauri-plugin-single-instance = "2"
# 应用自更新（签名校验 + 静态 JSON 端点；端点未配置时命令返回明确提示）
tauri-plugin-updater = "2"
# 原生对话框（环境工作区"选择文件夹"）
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 诊断日志：tauri-runtime-wry 把 "webview 创建失败" 吹进 log::error!（窗口永不入册
# → 之后所有消息都被丢弃，表现为 hwnd Unavailable / FailedToReceiveMessage）。
# 不接 logger 就是哑巴失败，接上才看得到真实原因。
log = { version = "0.4", features = ["std"] }
# 简约引擎中继（dsh_relay）：oneshot 回包 + spawn_blocking
tokio = { version = "1", features = ["sync", "time", "rt", "process", "io-util", "macros"] }
# 安装器 IO 层（整份照搬 hermes powershell.rs，用 anyhow::Result + Context）
anyhow = "1"
portable-pty = "0.9"
ureq = { version = "2", features = ["json"] }
# sessions.db 直读（bundled 自带 SQLite + FTS5 全文索引）
rusqlite = { version = "0.32", features = ["bundled"] }
chrono = "0.4"

[dev-dependencies]
# 发布产物签名自检（与 tauri-plugin-updater 同一校验链路）
base64 = "0.22"
minisign-verify = "0.2"

